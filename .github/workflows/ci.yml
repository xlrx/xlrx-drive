name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *" # nightly long simulator runs

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, Tests)
    runs-on: ubuntu-latest
    services:
      # Same major version as in production (PLAN 13.2).
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Programme für die Textextraktion (PDF, Texterkennung)
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr tesseract-ocr-deu
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (inkl. 1000 Simulator-Seeds je Variante, Server gegen PostgreSQL 18)
        run: cargo test --workspace
        env:
          XLRX_SIM_SEEDS: "1000"
          XLRX_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  web:
    name: Web (Typprüfung, Build, Ende-zu-Ende im Browser)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p xlrx-server
        working-directory: .
      - run: pnpm exec playwright install --with-deps chromium
      # An S3 server for the outside cache's end-to-end test.
      - run: cargo install s3s-fs --version 0.17.0 --features binary --locked
      - name: Ende-zu-Ende (Einrichtung, TOTP, Passkey per virtuellem Authenticator, Verwaltung)
        run: e2e/run.sh
        env:
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres

  no-avx:
    name: Läuft ohne AVX (DS918+ / Celeron J3455)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y qemu-user
      - run: cargo build --release -p xlrx-sim -p xlrx-chunk -p xlrx-server --examples --bins
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v2"
      # Denverton = Atom C3000 (Goldmont), like the J3455 without AVX. An "Illegal instruction" fails the build.
      - run: qemu-x86_64 -cpu Denverton target/release/xlrx-sim --count 20
      - run: qemu-x86_64 -cpu Denverton target/release/examples/hashdir crates
      - run: qemu-x86_64 -cpu Denverton target/release/xlrx-server bench-argon2 4096 1 1
      - run: qemu-x86_64 -cpu Denverton target/release/xlrx-server gen-secret

  simulation-nightly:
    name: Simulator-Langlauf
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        variant:
          - "--count 200000"
          - "--count 80000 --clients 3"
          - "--count 150000 --ci"
          - "--count 30000 --ci --clients 3 --steps 1000 --defer 300"
          - "--count 100000 --ci --exact-names 400"
          - "--count 100000 --coarse 8 --defer 300"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
      - name: Zufälliger Startwert (jede Nacht neue Szenarien)
        run: echo "FROM=$(( (RANDOM << 15 | RANDOM) * 1000 ))" >> "$GITHUB_ENV"
      - run: cargo run --release -p xlrx-sim -- --strict --from "$FROM" ${{ matrix.variant }}

  docker:
    name: Docker-Image (Bau, Rauchtest, compose)
    runs-on: ubuntu-latest
    needs: [rust, web]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/xlrx-drive-server
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.server
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Rauchtest
        run: |
          docker run --rm "$IMAGE:latest" gen-secret
          docker run --rm "$IMAGE:latest" bench-argon2 4096 1 1
          docker run --rm --entrypoint hashdir "$IMAGE:latest" /srv/web
      - name: compose-Datei prüfen
        run: |
          for s in pg_password database_url xlrx_secret_key s3_access_key s3_secret_key; do echo test > deploy/secrets/$s; done
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config -q
      - name: Veröffentlichen (nur main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
