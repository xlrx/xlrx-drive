[package]
name = "xlrx-chunk"
description = "Content-Defined Chunking (FastCDC) und BLAKE3-Hashing für xlrx-drive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["parallel"]
# Hasht die Chunks großer Dateien parallel (rayon).
parallel = ["dep:rayon"]

[dependencies]
blake3.workspace = true
fastcdc.workspace = true
rayon = { workspace = true, optional = true }
xlrx-proto.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
rayon.workspace = true
tempfile.workspace = true

[[bench]]
name = "chunking"
harness = false

[lints]
workspace = true
