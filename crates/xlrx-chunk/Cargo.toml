[package]
name = "xlrx-chunk"
description = "Content-defined chunking (FastCDC) and BLAKE3 hashing for xlrx-drive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["parallel"]
# Hashes the chunks of large files in parallel (rayon).
parallel = ["dep:rayon"]

[dependencies]
blake3.workspace = true
fastcdc.workspace = true
rayon = { workspace = true, optional = true }
xlrx-proto.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
rayon.workspace = true
tempfile.workspace = true

[[bench]]
name = "chunking"
harness = false

[lints]
workspace = true
