[package]
name = "xlrx-server"
description = "xlrx-drive server: API, sync, sign-in"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11"
argon2 = "0.6"
axum = "0.8"
base64 = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.13"
# Thumbnails: common photo and image formats only, pure Rust (SIMD chosen at runtime, fine without AVX).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
mime_guess = "2"
notify = { version = "8", default-features = false }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.10"
rayon.workspace = true
rustix = { version = "1.1", features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.11"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "time", "uuid", "json"] }
subtle = "2.6"
# Full-text search (PLAN 6.2): embedded index with German and English stemming, pure Rust.
tantivy = { version = "0.26", default-features = false, features = ["mmap", "lz4-compression", "stemmer"] }
thiserror.workspace = true
time = { version = "0.3", features = ["serde", "formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "fs", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = "0.5"
# Language of extracted texts (German or English stemmer).
whatlang = "0.18"
xlrx-chunk.workspace = true
xlrx-proto.workspace = true
xlrx-sync.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tempfile.workspace = true
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }

[lints]
workspace = true
