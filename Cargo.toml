[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
xlrx-proto = { path = "crates/xlrx-proto" }
xlrx-chunk = { path = "crates/xlrx-chunk" }
xlrx-sync = { path = "crates/xlrx-sync" }
xlrx-wire = { path = "crates/xlrx-wire" }

blake3 = "1.8"
# Pinned exactly: chunk boundaries feed into the content hash (schema "xlrx-content-v1").
# An update must not silently change the cut points; the golden test in xlrx-chunk checks this.
fastcdc = "=5.0.0"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-normalization = "0.1"

# Only for tests/benchmarks
proptest = "1.11"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev]
# The simulator runs many thousands of scenarios; some optimization pays off even in tests.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
